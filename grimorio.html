S("Conjurar Rajada","Conjure Barrage",3,"con","1 ação","Pessoal (cone de 18 m)","V, S, M (uma munição ou arma de arremesso)","Instantânea","Pt","Você arremessa uma arma ou dispara uma munição e ela se multiplica. Cada criatura no cone faz um TR de Destreza: 3d8 de dano do tipo da arma, metade se passar.","");
S("Contramágica","Counterspell",3,"abj","1 reação (ao ver uma criatura a até 18 m conjurando uma magia)","18 m","S","Instantânea","Bu Fe Ma","Você interrompe a conjuração. Se a magia for de 3º nível ou menor, ela falha. Se for de nível maior, faça um teste da sua habilidade de conjuração com CD 10 + nível da magia; se passar, ela falha.","A magia é interrompida automaticamente se o nível dela for igual ou menor ao do espaço usado.");
S("Criar Alimentos e Água","Create Food and Water",3,"con","1 ação","9 m","V, S","Instantânea","Cl Pa","Cria 22 kg de comida e 120 litros de água, o bastante para quinze humanoides ou cinco montarias por 24 horas. A comida estraga depois de 24 horas.","");
S("Manto do Cruzado","Crusader's Mantle",3,"evo","1 ação","Pessoal (raio de 9 m)","V","Concentração, até 1 minuto","Pa","Uma aura sagrada irradia de você. Cada criatura amigável na aura, inclusive você, causa 1d4 de dano radiante extra ao acertar ataques com arma.","");
S("Luz do Dia","Daylight",3,"evo","1 ação","18 m","V, S","1 hora","Cl Dr Fe Pa Pt","Uma esfera de 18 m de raio de luz plena, com penumbra por mais 18 m. Pode ser presa a um objeto. Se tocar escuridão criada por magia de 3º nível ou menor, dissipa essa magia.","");
S("Dissipar Magia","Dispel Magic",3,"abj","1 ação","36 m","V, S","Instantânea","Ba Bu Cl Dr Fe Ma Pa","Escolha uma criatura, objeto ou efeito mágico. Magias de 3º nível ou menor nele terminam. Para cada magia de 4º nível ou mais, faça um teste da sua habilidade de conjuração com CD 10 + nível da magia; se passar, ela termina.","Magias de nível igual ou menor ao do espaço usado terminam automaticamente.");
S("Arma Elemental","Elemental Weapon",3,"tra","1 ação","Toque","V, S","Concentração, até 1 hora","Pa","Uma arma não mágica se torna mágica. Escolha ácido, frio, fogo, elétrico ou trovejante: a arma ganha +1 nas jogadas de ataque e causa +1d4 de dano desse tipo.","Com espaço de 5º ou 6º nível: +2 e +2d4. Com espaço de 7º nível ou mais: +3 e +3d4.");
S("Medo","Fear",3,"ilu","1 ação","Pessoal (cone de 9 m)","V, S, M (uma pena branca)","Concentração, até 1 minuto","Ba Bu Fe Ma","Cada criatura no cone faz um TR de Sabedoria ou larga o que estiver segurando e fica amedrontada. Enquanto amedrontada, precisa usar a ação Disparada e se afastar de você pelo caminho mais seguro. Se terminar o turno sem linha de visão com você, repete o TR.","");
S("Fingir Morte","Feign Death",3,"nec","1 ação","Toque","V, S, M (uma pitada de terra de cemitério)","1 hora","Ba Cl Dr Ma","Uma criatura voluntária entra num estado que não se distingue da morte. Fica cega e incapacitada, com deslocamento 0 e resistência a todo dano exceto psíquico. Doenças e venenos ficam suspensos.","","R");
S("Bola de Fogo","Fireball",3,"evo","1 ação","45 m","V, S, M (guano de morcego e enxofre)","Instantânea","Fe Ma","Uma explosão de chamas enche uma esfera de 6 m de raio. Cada criatura faz um TR de Destreza: 8d6 de dano de fogo, metade se passar. O fogo contorna esquinas e incendeia objetos inflamáveis que não estejam sendo carregados.","+1d6 de dano para cada nível de espaço acima do 3º.");
S("Voo","Fly",3,"tra","1 ação","Toque","V, S, M (uma pena de asa)","Concentração, até 10 minutos","Bu Fe Ma","Uma criatura voluntária ganha deslocamento de voo de 18 m. Se a magia terminar enquanto ela estiver no ar, ela cai.","Uma criatura adicional para cada nível de espaço acima do 3º.");
S("Forma Gasosa","Gaseous Form",3,"tra","1 ação","Toque","V, S, M (um pouco de gaze e um fiapo de fumaça)","Concentração, até 1 hora","Bu Fe Ma","Uma criatura voluntária vira névoa: voo de 3 m, resistência a dano não mágico, vantagem em TR de Força, Destreza e Constituição, e passa por frestas pequenas. Não pode falar, atacar, conjurar magias nem manipular objetos.","");
S("Glifo de Vigilância","Glyph of Warding",3,"abj","1 hora","Toque","V, S, M (incenso e pó de diamante de 200 po, consumidos)","Até ser dissipada ou ativada","Ba Cl Ma","Você inscreve um glifo quase invisível numa superfície ou objeto fechado e define o gatilho. Runas Explosivas: esfera de 6 m, TR de Destreza, 5d8 de dano ácido, frio, fogo, elétrico ou trovejante (metade se passar). Glifo de Magia: guarda uma magia de 3º nível ou menor, liberada quando o glifo é ativado.","Runas: +1d8 de dano para cada nível acima do 3º. Glifo de magia: guarda magia de nível igual ao do espaço usado.");
S("Velocidade","Haste",3,"tra","1 ação","9 m","V, S, M (uma raspa de raiz de alcaçuz)","Concentração, até 1 minuto","Fe Ma","Uma criatura voluntária tem deslocamento dobrado, +2 na CA, vantagem em TR de Destreza e uma ação extra por turno (só para um ataque com arma, Disparada, Desengajar, Esconder ou Usar um Objeto). Quando a magia termina, o alvo não pode se mover nem agir até depois do próximo turno dele.","");
S("Fome de Hadar","Hunger of Hadar",3,"con","1 ação","45 m","V, S, M (um tentáculo de polvo em conserva)","Concentração, até 1 minuto","Bu","Uma esfera de 6 m de raio de escuridão e frio sobrenatural surge. A área é escuridão total e terreno difícil. Quem começar o turno nela sofre 2d6 de dano de frio. Quem terminar o turno nela faz um TR de Destreza ou sofre 2d6 de dano ácido de tentáculos invisíveis.","+1d6 no dano de frio ou ácido para cada nível de espaço acima do 3º.");
S("Padrão Hipnótico","Hypnotic Pattern",3,"ilu","1 ação","36 m","S, M (um bastão de incenso aceso ou um frasco com material fosforescente)","Concentração, até 1 minuto","Ba Bu Fe Ma","Um padrão de cores sinuosas surge num cubo de 9 m. Cada criatura na área que o veja faz um TR de Sabedoria ou fica enfeitiçada: incapacitada e com deslocamento 0. O efeito termina para a criatura se ela sofrer dano ou se alguém usar uma ação para sacudi-la.","");
S("Pequena Cabana de Leomund","Leomund's Tiny Hut",3,"evo","1 minuto","Pessoal (hemisfério de 3 m)","V, S, M (uma pequena conta de cristal)","8 horas","Ba Ma","Uma cúpula de energia imóvel com 3 m de raio cobre você e até nove criaturas Médias. Criaturas e objetos de fora não entram (só os que estavam dentro na conjuração) e magias não atravessam. O interior fica seco e confortável. A magia termina se você sair.","","R");
S("Flecha Relampejante","Lightning Arrow",3,"tra","1 ação bônus","Pessoal","V, S","Concentração, até 1 minuto","Pt","No seu próximo ataque à distância com arma, a munição vira um raio. Se acertar, o alvo sofre 4d8 de dano elétrico (metade se errar) em vez do dano normal. Cada criatura a até 3 m do alvo faz um TR de Destreza: 2d8 de dano elétrico, metade se passar.","+1d8 nos dois efeitos para cada nível de espaço acima do 3º.");
S("Relâmpago","Lightning Bolt",3,"evo","1 ação","Pessoal (linha de 30 m)","V, S, M (um pouco de pelo e uma vara de âmbar ou vidro)","Instantânea","Fe Ma","Um raio corta uma linha de 30 m por 1,5 m. Cada criatura na linha faz um TR de Destreza: 8d6 de dano elétrico, metade se passar. Incendeia objetos inflamáveis que não estejam sendo carregados.","+1d6 de dano para cada nível de espaço acima do 3º.");
S("Círculo Mágico","Magic Circle",3,"abj","1 minuto","3 m","V, S, M (água benta ou pó de prata e ferro de 100 po, consumidos)","1 hora","Bu Cl Ma Pa","Cria um cilindro de 3 m de raio e 6 m de altura contra celestiais, elementais, fadas, corruptores ou mortos-vivos (escolha um ou mais). Essas criaturas não entram voluntariamente por meios não mágicos, têm desvantagem em ataques contra quem está dentro e não podem enfeitiçar, amedrontar nem possuir quem está dentro. Pode ser invertido para prender uma criatura.","+1 hora de duração para cada nível de espaço acima do 3º.");
S("Imagem Maior","Major Image",3,"ilu","1 ação","36 m","V, S, M (um pouco de lã)","Concentração, até 10 minutos","Ba Bu Fe Ma","Cria a imagem de um objeto, criatura ou fenômeno que caiba num cubo de 6 m, com som, cheiro e temperatura convincentes (não causa dano). Com uma ação, você move e anima a imagem. Interação física revela a ilusão, assim como um teste de Inteligência (Investigação) contra a CD da sua magia.","Com espaço de 6º nível ou mais, dura até ser dissipada, sem concentração.");
S("Palavra Curativa em Massa","Mass Healing Word",3,"evo","1 ação bônus","18 m","V","Instantânea","Cl","Até seis criaturas que você possa ver recuperam PV iguais a 1d4 + seu modificador de habilidade de conjuração. Não afeta mortos-vivos nem constructos.","+1d4 de cura para cada nível de espaço acima do 3º.");
S("Mesclar-se às Rochas","Meld into Stone",3,"tra","1 ação","Toque","V, S","8 horas","Cl Dr","Você entra numa pedra grande o bastante para conter você e o que carrega. Não pode ser visto por meios não mágicos e ouve o exterior abafado. Dano à pedra pode expulsar você; se a pedra for destruída, você sofre 6d6 de dano contundente.","","R");
S("Dificultar Detecção","Nondetection",3,"abj","1 ação","Toque","V, S, M (pó de diamante de 25 po, consumido)","8 horas","Ba Ma Pt","Esconde uma criatura voluntária, um lugar ou um objeto (até 3 m) de magias de adivinhação. O alvo não pode ser mirado por adivinhação nem percebido por sensores mágicos de vidência.","");
S("Montaria Fantasmagórica","Phantom Steed",3,"ilu","1 minuto","9 m","V, S","1 hora","Ma","Uma criatura Grande quase real, parecida com um cavalo, aparece com sela e arreios. Tem deslocamento de 30 m e percorre 15 km por hora. Some se sofrer qualquer dano.","","R");
S("Ampliar Plantas","Plant Growth",3,"tra","1 ação ou 8 horas","45 m","V, S","Instantânea","Ba Dr Pt","Com 1 ação: as plantas num raio de 30 m ficam espessas e emaranhadas; andar ali custa 4 vezes o movimento (você pode excluir áreas). Com 8 horas: as plantas num raio de 750 m ficam enriquecidas e produzem o dobro por um ano.","");
S("Proteção contra Energia","Protection from Energy",3,"abj","1 ação","Toque","V, S","Concentração, até 1 hora","Cl Dr Fe Ma Pt","Uma criatura voluntária tem resistência a um tipo de dano à sua escolha: ácido, frio, fogo, elétrico ou trovejante.","");
S("Remover Maldição","Remove Curse",3,"abj","1 ação","Toque","V, S","Instantânea","Bu Cl Ma Pa","Todas as maldições que afetam uma criatura ou objeto terminam. Num item mágico amaldiçoado, a maldição continua, mas a sintonia do dono se quebra e ele pode se livrar do item.","");
S("Revivificar","Revivify",3,"nec","1 ação","Toque","V, S, M (diamantes de 300 po, consumidos)","Instantânea","Cl Pa","Uma criatura que morreu no último minuto volta à vida com 1 PV. Não funciona em quem morreu de velhice nem restaura partes do corpo perdidas.","");
S("Enviar Mensagem","Sending",3,"evo","1 ação","Ilimitado","V, S, M (um fio curto de cobre)","1 rodada","Ba Cl Ma","Você envia uma mensagem de até 25 palavras a uma criatura que conheça. Ela ouve na mente, reconhece você e pode responder da mesma forma. Funciona entre planos, com 5% de chance de falhar.","");
S("Nevasca","Sleet Storm",3,"con","1 ação","45 m","V, S, M (uma pitada de pó e gotas de água)","Concentração, até 1 minuto","Dr Fe Ma","Chuva gelada e granizo caem num cilindro de 12 m de raio e 6 m de altura. A área fica densamente obscurecida e é terreno difícil, e chamas expostas se apagam. Quem entrar ou começar o turno ali faz um TR de Destreza ou cai. Quem estiver se concentrando faz um TR de Constituição ou perde a concentração.","");
S("Lentidão","Slow",3,"tra","1 ação","36 m","V, S, M (uma gota de melaço)","Concentração, até 1 minuto","Fe Ma","Até seis criaturas num cubo de 12 m fazem um TR de Sabedoria. Quem falhar tem o deslocamento reduzido à metade, -2 na CA e nos TR de Destreza, não pode fazer reações, só pode fazer uma ação ou ação bônus por turno e no máximo um ataque; magias de 1 ação têm 50% de chance de só funcionar no turno seguinte. Repete o TR no fim de cada turno.","");
S("Falar com os Mortos","Speak with Dead",3,"nec","1 ação","3 m","V, S, M (incenso aceso)","10 minutos","Ba Cl","Um cadáver com boca responde até cinco perguntas. Só sabe o que sabia em vida, e as respostas costumam ser curtas e enigmáticas. Não funciona se o corpo foi alvo desta magia nos últimos 10 dias ou se for morto-vivo.","");
S("Falar com Plantas","Speak with Plants",3,"tra","1 ação","Pessoal (raio de 9 m)","V, S","10 minutos","Ba Dr Pt","As plantas a até 9 m ganham consciência limitada. Você pode perguntar sobre o que aconteceu na área no último dia e pedir favores simples, como abrir caminho numa vegetação densa.","");
S("Espíritos Guardiões","Spirit Guardians",3,"con","1 ação","Pessoal (raio de 4,5 m)","V, S, M (um símbolo sagrado)","Concentração, até 10 minutos","Cl","Espíritos protegem você num raio de 4,5 m. Criaturas que você escolher ficam imunes. Para as demais, o deslocamento cai pela metade na área e, ao entrar nela pela primeira vez num turno ou começar o turno ali, fazem um TR de Sabedoria: 3d8 de dano radiante (se você for bom ou neutro) ou necrótico (se for mau), metade se passar.","+1d8 de dano para cada nível de espaço acima do 3º.");
S("Névoa Fétida","Stinking Cloud",3,"con","1 ação","27 m","V, S, M (um ovo podre)","Concentração, até 1 minuto","Ba Fe Ma","Uma esfera de gás amarelo nauseante com 6 m de raio, densamente obscurecida. Quem começar o turno ali faz um TR de Constituição ou gasta a ação desse turno vomitando. Imunes a veneno e quem não respira passam automaticamente.","");
S("Idiomas","Tongues",3,"adv","1 ação","Toque","V, M (um pequeno zigurate de argila)","1 hora","Ba Bu Cl Fe Ma","A criatura tocada entende qualquer idioma falado que ouvir e, quando fala, é entendida por qualquer criatura que conheça ao menos um idioma.","");
S("Toque Vampírico","Vampiric Touch",3,"nec","1 ação","Pessoal","V, S","Concentração, até 1 minuto","Bu Ma","Faça um ataque mágico corpo a corpo: se acertar, causa 3d6 de dano necrótico e você recupera PV iguais à metade do dano. Você pode repetir o ataque com sua ação em cada turno até a magia acabar.","+1d6 de dano para cada nível de espaço acima do 3º.");
S("Respirar na Água","Water Breathing",3,"tra","1 ação","9 m","V, S, M (um junco ou canudo)","24 horas","Dr Fe Ma Pt","Até dez criaturas voluntárias podem respirar debaixo d'água, sem perder a respiração normal.","","R");
S("Andar na Água","Water Walk",3,"tra","1 ação","9 m","V, S, M (um pedaço de cortiça)","1 hora","Cl Dr Fe Pt","Até dez criaturas voluntárias andam sobre qualquer líquido (água, ácido, lama, neve, areia movediça, lava) como se fosse chão firme. Quem estiver submerso sobe à superfície a 18 m por rodada.","","R");
S("Muralha de Vento","Wind Wall",3,"evo","1 ação","36 m","V, S, M (um leque pequeno e uma pena exótica)","Concentração, até 1 minuto","Dr Pt","Uma muralha de vento forte (até 15 m de comprimento, 4,5 m de altura e 30 cm de espessura). Ao surgir, cada criatura na área faz um TR de Força: 3d8 de dano contundente, metade se passar. Afasta névoa, fumaça e gases; criaturas Pequenas ou menores voando não passam; flechas e munição comum são desviadas.","");

// ───── 4º NÍVEL ─────
S("Olho Arcano","Arcane Eye",4,"adv","1 ação","9 m","V, S, M (um pouco de pelo de morcego)","Concentração, até 1 hora","Ma","Cria um olho mágico invisível e flutuante, com visão no escuro de 9 m, e você recebe o que ele vê. Com uma ação, você move o olho até 9 m em qualquer direção. Ele passa por frestas de 2,5 cm, mas não atravessa barreiras sólidas.","");
S("Aura de Vida","Aura of Life",4,"abj","1 ação","Pessoal (raio de 9 m)","V","Concentração, até 10 minutos","Pa","Criaturas não hostis na aura, inclusive você, têm resistência a dano necrótico, e os PV máximos delas não podem ser reduzidos. Uma criatura viva não hostil com 0 PV que começar o turno na aura recupera 1 PV.","");
S("Aura de Pureza","Aura of Purity",4,"abj","1 ação","Pessoal (raio de 9 m)","V","Concentração, até 10 minutos","Pa","Criaturas não hostis na aura, inclusive você, não podem ficar doentes, têm resistência a dano de veneno e vantagem em TR contra cego, enfeitiçado, surdo, amedrontado, paralisado, envenenado e atordoado.","");
S("Banimento","Banishment",4,"abj","1 ação","18 m","V, S, M (um item desagradável ao alvo)","Concentração, até 1 minuto","Bu Cl Fe Ma Pa","Uma criatura faz um TR de Carisma ou é banida. Se for nativa deste plano, vai para um semiplano inofensivo, onde fica incapacitada, e volta quando a magia acaba. Se for de outro plano, retorna ao plano natal; se a magia durar o minuto inteiro, ela não volta.","Uma criatura adicional para cada nível de espaço acima do 4º.");
S("Praga","Blight",4,"nec","1 ação","9 m","V, S","Instantânea","Bu Dr Fe Ma","Energia necrótica drena a umidade de uma criatura. Ela faz um TR de Constituição: 8d8 de dano necrótico, metade se passar. Não afeta mortos-vivos nem constructos. Plantas têm desvantagem e sofrem o dano máximo.","+1d8 de dano para cada nível de espaço acima do 4º.");
S("Compulsão","Compulsion",4,"enc","1 ação","9 m","V, S","Concentração, até 1 minuto","Ba","Criaturas escolhidas que possam ouvir você fazem um TR de Sabedoria. Em cada turno seu, com uma ação bônus, você escolhe uma direção horizontal: quem falhou usa todo o movimento possível para ir nessa direção (sem entrar em perigo óbvio) antes de agir. Após se mover, repete o TR.","");
S("Confusão","Confusion",4,"enc","1 ação","27 m","V, S, M (três cascas de noz)","Concentração, até 1 minuto","Ba Dr Fe Ma","Criaturas numa esfera de 3 m de raio fazem um TR de Sabedoria. Quem falhar age de forma aleatória: no início do turno, role 1d10 (1: move-se numa direção aleatória; 2 a 6: não faz nada; 7 ou 8: ataca uma criatura aleatória ao alcance; 9 ou 10: age normalmente). Repete o TR no fim de cada turno.","+1,5 m de raio para cada nível de espaço acima do 4º.");
S("Conjurar Elementais Menores","Conjure Minor Elementals",4,"con","1 minuto","27 m","V, S","Concentração, até 1 hora","Dr Ma","Convoca elementais: um de ND 2, dois de ND 1, quatro de ND 1/2 ou oito de ND 1/4. São amigáveis a você e obedecem comandos verbais.","Espaço de 6º nível: o dobro de criaturas. 8º: o triplo.");
S("Conjurar Seres da Floresta","Conjure Woodland Beings",4,"con","1 ação","18 m","V, S, M (uma baga de azevinho por criatura)","Concentração, até 1 hora","Dr Pt","Convoca criaturas feéricas: uma de ND 2, duas de ND 1, quatro de ND 1/2 ou oito de ND 1/4. São amigáveis a você e obedecem comandos verbais.","Espaço de 6º nível: o dobro de criaturas. 8º: o triplo.");
S("Controlar Água","Control Water",4,"tra","1 ação","90 m","V, S, M (uma gota de água e uma pitada de pó)","Concentração, até 10 minutos","Cl Dr Ma","Você controla a água num cubo de até 30 m. Efeitos: Inundação (o nível sobe até 6 m ou forma uma onda), Dividir Águas (abre uma trincheira), Redirecionar Fluxo, ou Redemoinho (criaturas fazem TR de Força ou sofrem 2d8 de dano contundente e ficam presas).","");
S("Proteção contra a Morte","Death Ward",4,"abj","1 ação","Toque","V, S","8 horas","Cl Pa","Na primeira vez que o alvo cairia a 0 PV, ele fica com 1 PV e a magia termina. Se um efeito fosse matá-lo instantaneamente sem causar dano, o efeito é anulado e a magia termina.","");
S("Porta Dimensional","Dimension Door",4,"con","1 ação","150 m","V","Instantânea","Ba Bu Fe Ma","Você se teletransporta para um ponto no alcance que possa ver, descrever ou indicar (por exemplo, 60 m para baixo). Pode levar uma criatura voluntária do seu tamanho ou menor que esteja ao seu alcance. Se o destino estiver ocupado, vocês sofrem 4d6 de dano de energia e a magia falha.","");
S("Adivinhação","Divination",4,"adv","1 ação","Pessoal","V, S, M (incenso e uma oferenda de 25 po, consumidos)","Instantânea","Cl","Você faz uma pergunta sobre um objetivo, evento ou atividade dos próximos 7 dias e recebe uma resposta verdadeira (frase curta, rima ou presságio). Cada conjuração adicional antes de um descanso longo tem 25% de chance cumulativa de dar uma resposta aleatória.","","R");
S("Dominar Besta","Dominate Beast",4,"enc","1 ação","18 m","V, S","Concentração, até 1 minuto","Dr Fe","Uma besta faz um TR de Sabedoria (com vantagem se estiver lutando com você) ou fica enfeitiçada. Você dá comandos telepáticos; com uma reação, pode controlar diretamente as ações dela. Sempre que ela sofrer dano, repete o TR.","5º nível: até 10 minutos. 6º: até 1 hora. 7º ou mais: até 8 horas.");
S("Tentáculos Negros de Evard","Evard's Black Tentacles",4,"con","1 ação","27 m","V, S, M (um tentáculo de polvo ou lula gigante)","Concentração, até 1 minuto","Ma","Tentáculos cobrem um quadrado de 6 m, que vira terreno difícil. Quem entrar na área pela primeira vez num turno ou começar o turno ali faz um TR de Destreza: 3d6 de dano contundente e fica impedido. Preso, sofre 3d6 no início de cada turno. Pode usar uma ação para um teste de Força ou Destreza contra a CD da sua magia para se soltar.","");
S("Fabricar","Fabricate",4,"tra","10 minutos","36 m","V, S","Instantânea","Ma","Converte matéria-prima em produtos do mesmo material (madeira em ponte, linho em roupas, e assim por diante), até um cubo de 3 m (ou 1,5 m para minério). A qualidade depende da matéria-prima. Itens que exigem muita perícia exigem proficiência com as ferramentas certas.","");
S("Escudo de Fogo","Fire Shield",4,"evo","1 ação","Pessoal","V, S, M (um pouco de fósforo ou um vaga-lume)","10 minutos","Ma","Chamas envolvem você e iluminam 3 m. Escudo quente: resistência a frio. Escudo frio: resistência a fogo. Quando uma criatura a até 1,5 m acertar você com um ataque corpo a corpo, sofre 2d8 de dano de fogo (escudo quente) ou de frio (escudo frio).","");
S("Movimentação Livre","Freedom of Movement",4,"abj","1 ação","Toque","V, S, M (uma tira de couro amarrada no braço)","1 hora","Ba Cl Dr Pt","O deslocamento da criatura não é afetado por terreno difícil, e magias não podem reduzi-lo nem deixá-la paralisada ou impedida. Ela pode gastar 1,5 m de movimento para escapar de amarras não mágicas. Debaixo d'água, não sofre penalidade de movimento nem de ataque.","");
S("Inseto Gigante","Giant Insect",4,"tra","1 ação","9 m","V, S","Concentração, até 10 minutos","Dr","Transforma até dez centopeias, três aranhas, cinco vespas ou um escorpião em versões gigantes, que obedecem seus comandos verbais.","");
S("Vinha Esmagadora","Grasping Vine",4,"con","1 ação bônus","9 m","V, S","Concentração, até 1 minuto","Dr Pt","Uma vinha brota do chão. Com uma ação bônus, ela tenta agarrar uma criatura a até 9 m: TR de Destreza ou a criatura é puxada 6 m em direção à vinha.","");
S("Invisibilidade Maior","Greater Invisibility",4,"ilu","1 ação","Toque","V, S","Concentração, até 1 minuto","Ba Fe Ma","Você ou uma criatura tocada fica invisível até a magia acabar, mesmo que ataque ou conjure magias.","");
S("Guardião da Fé","Guardian of Faith",4,"con","1 ação","9 m","V","8 horas","Cl","Um guardião espectral Grande ocupa um espaço e fornece cobertura. Qualquer inimigo que chegar a até 3 m dele pela primeira vez num turno faz um TR de Destreza: 20 de dano radiante, metade se passar. O guardião some depois de causar 60 de dano no total.","");
S("Terreno Alucinógeno","Hallucinatory Terrain",4,"ilu","10 minutos","90 m","V, S, M (uma pedra, um galho e um pedaço de planta)","24 horas","Ba Bu Dr Ma","O terreno natural num cubo de 45 m parece, soa e cheira como outro tipo de terreno (campo vira pântano, estrada vira ravina). Construções não mudam. Tocar não desfaz a ilusão; um teste de Inteligência (Investigação) contra a CD da sua magia a revela.","");
S("Tempestade de Gelo","Ice Storm",4,"evo","1 ação","90 m","V, S, M (uma pitada de pó e gotas de água)","Instantânea","Dr Fe Ma","Granizo cai num cilindro de 6 m de raio e 12 m de altura. Cada criatura faz um TR de Destreza: 2d8 de dano contundente e 4d6 de dano de frio, metade se passar. A área vira terreno difícil até o fim do seu próximo turno.","+1d8 de dano contundente para cada nível de espaço acima do 4º.");
S("Baú Secreto de Leomund","Leomund's Secret Chest",4,"con","1 ação","Toque","V, S, M (um baú de 5.000 po e uma réplica em miniatura de 50 po)","Instantânea","Ma","Esconde um baú e seu conteúdo no Plano Etéreo. Com uma ação, você toca a réplica e traz o baú de volta. Depois de 60 dias, há 5% de chance cumulativa por dia de a magia acabar e o baú se perder.","");
S("Localizar Criatura","Locate Creature",4,"adv","1 ação","Pessoal","V, S, M (pelo de cão de caça)","Concentração, até 1 hora","Ba Cl Dr Ma Pa Pt","Descreva ou nomeie uma criatura que você conheça. Você sente a direção dela se estiver a até 300 m. Pode procurar uma criatura específica que já viu de perto ou a mais próxima de um tipo. É bloqueada por água corrente e não funciona se a criatura estiver em outra forma.","");
S("Cão Fiel de Mordenkainen","Mordenkainen's Faithful Hound",4,"con","1 ação","9 m","V, S, M (um apito de prata, um osso e um fio)","8 horas","Ma","Um cão de guarda fantasmagórico e invisível vigia um ponto. Late quando uma criatura se aproxima a até 9 m sem dizer a senha. Vê criaturas invisíveis e o Plano Etéreo. No início de cada turno seu, morde uma criatura hostil a até 1,5 m: use seu bônus de ataque mágico, 4d8 de dano perfurante.","");
S("Santuário Particular de Mordenkainen","Mordenkainen's Private Sanctum",4,"abj","10 minutos","36 m","V, S, M (chumbo, vidro opaco, algodão e pó de crisólito)","24 horas","Ma","Protege uma área de até 30 m de lado. Escolha os efeitos: sons não atravessam as bordas; a área parece escura e enevoada de fora; sensores de adivinhação não entram; teletransporte e viagem planar são bloqueados nas bordas.","A área aumenta com espaços maiores. Conjurar no mesmo lugar todo dia por um ano torna a magia permanente.");
S("Esfera Resiliente de Otiluke","Otiluke's Resilient Sphere",4,"evo","1 ação","9 m","V, S, M (um cristal hemisférico e dois hemisférios de goma-arábica)","Concentração, até 1 minuto","Ma","Uma esfera de energia envolve uma criatura ou objeto Grande ou menor (criatura não voluntária faz um TR de Destreza). Nada atravessa a esfera e ela é imune a dano. Quem está dentro pode rolá-la. Desintegrar destrói a esfera.","");
S("Assassino Fantasmagórico","Phantasmal Killer",4,"ilu","1 ação","36 m","V, S","Concentração, até 1 minuto","Ma","Você cria a ilusão do pior medo de uma criatura, visível só para ela. Ela faz um TR de Sabedoria ou fica amedrontada. No fim de cada turno dela, repete o TR: se falhar, sofre 4d10 de dano psíquico; se passar, a magia termina.","+1d10 de dano para cada nível de espaço acima do 4º.");
S("Metamorfose","Polymorph",4,"tra","1 ação","18 m","V, S, M (um casulo de lagarta)","Concentração, até 1 hora","Ba Dr Fe Ma","Transforma uma criatura numa besta (TR de Sabedoria se não for voluntária; metamorfos são imunes). O ND da besta deve ser igual ou menor que o do alvo (ou o nível dele). O alvo assume as estatísticas da besta, mas mantém personalidade e tendência. Se a nova forma cair a 0 PV, ele volta à forma original com os PV que tinha.","");
S("Destruição Estonteante","Staggering Smite",4,"evo","1 ação bônus","Pessoal","V","Concentração, até 1 minuto","Pa","Na próxima vez que você acertar com um ataque corpo a corpo com arma, o alvo sofre +4d6 de dano psíquico e faz um TR de Sabedoria. Se falhar, tem desvantagem em ataques e testes de habilidade e não pode fazer reações até o fim do próximo turno dele.","");
S("Moldar Rochas","Stone Shape",4,"tra","1 ação","Toque","V, S, M (argila macia)","Instantânea","Cl Dr Ma","Molda um objeto de pedra Médio ou menor, ou uma seção de pedra de até 1,5 m, na forma que você quiser: uma arma, um ídolo, uma abertura, uma porta. Mecanismos simples são possíveis.","");
S("Pele de Pedra","Stoneskin",4,"abj","1 ação","Toque","V, S, M (pó de diamante de 100 po, consumido)","Concentração, até 1 hora","Dr Fe Ma Pt","A pele de uma criatura voluntária fica dura como pedra: ela tem resistência a dano contundente, cortante e perfurante não mágico.","");
S("Muralha de Fogo","Wall of Fire",4,"evo","1 ação","36 m","V, S, M (um pedaço de fósforo)","Concentração, até 1 minuto","Dr Fe Ma","Uma muralha de fogo de até 18 m de comprimento, 6 m de altura e 30 cm de espessura (ou um anel de 6 m de diâmetro). Ao surgir, criaturas na área fazem um TR de Destreza: 5d8 de dano de fogo, metade se passar. Um lado, à sua escolha, causa 5d8 de dano de fogo a quem terminar o turno a até 3 m dele ou dentro da muralha.","+1d8 de dano para cada nível de espaço acima do 4º.");

// ───── 5º NÍVEL ─────
S("Animar Objetos","Animate Objects",5,"tra","1 ação","36 m","V, S","Concentração, até 1 minuto","Ba Fe Ma","Até dez objetos não mágicos que não estejam sendo carregados ganham vida sob seu controle (Médio conta como dois, Grande como quatro, Enorme como oito). Com uma ação bônus, você comanda qualquer um a até 150 m. Ataque e dano por tamanho: Miúdo +8, 1d4+4; Pequeno +6, 1d8+2; Médio +5, 2d6+1; Grande +6, 2d10+2; Enorme +8, 2d12+4.","Dois objetos adicionais para cada nível de espaço acima do 5º.");
S("Concha Antivida","Antilife Shell",5,"abj","1 ação","Pessoal (raio de 3 m)","V, S","Concentração, até 1 hora","Dr","Uma barreira de 3 m de raio se move com você e impede criaturas que não sejam mortos-vivos ou constructos de passar ou de alcançar você através dela. Se você empurrar a barreira contra uma criatura, a magia termina.","");
S("Despertar","Awaken",5,"tra","8 horas","Toque","V, S, M (uma ágata de 1.000 po, consumida)","Instantânea","Ba Dr","Uma besta ou planta Enorme ou menor com Inteligência 3 ou menos passa a ter Inteligência 10, fala um idioma que você conhece e fica enfeitiçada por você por 30 dias. Plantas despertas ganham mobilidade e sentidos.","");
S("Destruição Banidora","Banishing Smite",5,"abj","1 ação bônus","Pessoal","V","Concentração, até 1 minuto","Pa","Na próxima vez que você acertar com um ataque com arma, o alvo sofre +5d10 de dano de energia. Se esse ataque deixar o alvo com 50 PV ou menos, ele é banido: se for de outro plano, volta para lá; senão, vai para um semiplano inofensivo até a magia acabar.","");
S("Mão de Bigby","Bigby's Hand",5,"evo","1 ação","36 m","V, S, M (uma casca de ovo e uma luva de pele de cobra)","Concentração, até 1 minuto","Ma","Uma mão Grande de energia (CA 20, PV iguais aos seus PV máximos). Com uma ação bônus, você a move até 18 m e escolhe: Punho Cerrado (ataque mágico corpo a corpo, 4d8 de dano de energia), Mão Poderosa (empurra a criatura), Mão Agarradora (agarra e esmaga, 2d6 + seu modificador) ou Mão Interposta (dá cobertura).","+2d8 no Punho Cerrado e +2d6 na Mão Agarradora para cada nível de espaço acima do 5º.");
S("Círculo de Poder","Circle of Power",5,"abj","1 ação","Pessoal (raio de 9 m)","V","Concentração, até 10 minutos","Pa","Criaturas amigáveis na aura, inclusive você, têm vantagem em TR contra magias e outros efeitos mágicos. Quando passam num TR contra um efeito que causaria metade do dano, não sofrem dano algum.","");
S("Névoa Mortal","Cloudkill",5,"con","1 ação","36 m","V, S","Concentração, até 10 minutos","Fe Ma","Uma esfera de névoa venenosa amarelo-esverdeada de 6 m de raio, densamente obscurecida, que se afasta de você 3 m por turno. Quem entrar nela pela primeira vez num turno ou começar o turno ali faz um TR de Constituição: 5d8 de dano de veneno, metade se passar.","+1d8 de dano para cada nível de espaço acima do 5º.");
S("Comunhão","Commune",5,"adv","1 minuto","Pessoal","V, S, M (incenso e um frasco de água benta ou profana)","1 minuto","Cl","Você contata sua divindade ou um agente divino e faz até três perguntas de sim ou não. A resposta pode ser 'incerto' se estiver além do conhecimento do ser. Repetir antes de um descanso longo tem 25% de chance cumulativa de ficar sem resposta.","","R");
S("Comunhão com a Natureza","Commune with Nature",5,"adv","1 minuto","Pessoal","V, S","Instantânea","Dr Pt","Você entra em sintonia com a natureza e conhece o território num raio de 4,5 km (ao ar livre) ou 90 m (no subterrâneo). Aprende até três fatos: terreno, corpos d'água, plantas, minerais, animais, criaturas, influências de outros planos ou construções.","","R");
S("Cone de Frio","Cone of Cold",5,"evo","1 ação","Pessoal (cone de 18 m)","V, S, M (um pequeno cone de cristal ou vidro)","Instantânea","Fe Ma","Uma rajada de ar gelado. Cada criatura no cone faz um TR de Constituição: 8d8 de dano de frio, metade se passar. Uma criatura morta por esta magia vira uma estátua congelada.","+1d8 de dano para cada nível de espaço acima do 5º.");
S("Conjurar Elemental","Conjure Elemental",5,"con","1 minuto","27 m","V, S, M (incenso, argila, enxofre e fósforo, ou água e areia)","Concentração, até 1 hora","Dr Ma","Convoca um elemental de ND 5 ou menor a partir de uma porção de ar, terra, fogo ou água de 3 m. Ele é amigável e obedece comandos verbais. Se a concentração for quebrada, o elemental fica hostil e não some.","+1 no ND máximo para cada nível de espaço acima do 5º.");
S("Conjurar Saraivada","Conjure Volley",5,"con","1 ação","45 m","V, S, M (uma munição ou arma de arremesso)","Instantânea","Pt","A munição se multiplica e cai num cilindro de 12 m de raio e 6 m de altura. Cada criatura na área faz um TR de Destreza: 8d8 de dano do tipo da arma, metade se passar.","");
S("Contato Extraplanar","Contact Other Plane",5,"adv","1 minuto","Pessoal","V","1 minuto","Bu Ma","Você contata um semideus, o espírito de um sábio morto ou outra entidade misteriosa e pode fazer até cinco perguntas. Antes, faça um TR de Inteligência CD 15: se falhar, sofre 6d6 de dano psíquico e fica insano até um descanso longo. Se passar, as respostas são de uma palavra: sim, não, talvez, nunca, irrelevante ou incerto.","","R");
S("Contágio","Contagion",5,"nec","1 ação","Toque","V, S","7 dias","Cl Dr","Faça um ataque mágico corpo a corpo: se acertar, o alvo fica envenenado. No fim de cada turno dele, faz um TR de Constituição. Com três falhas, contrai uma doença à sua escolha pela duração (Febre Cegante, Fogo Mental, Podridão da Carne, entre outras); com três sucessos, se recupera.","");
S("Criação","Creation",5,"ilu","1 minuto","9 m","V, S, M (um pedaço do material a criar)","Especial","Fe Ma","Cria um objeto inanimado de matéria vegetal ou mineral que caiba num cubo de 1,5 m. A duração depende do material: vegetal, 1 dia; pedra ou cristal, 12 horas; metais preciosos, 1 hora; gemas, 10 minutos; adamante ou mitral, 1 minuto.","+1,5 m no cubo para cada nível de espaço acima do 5º.");
S("Onda Destrutiva","Destructive Wave",5,"evo","1 ação","Pessoal (raio de 9 m)","V","Instantânea","Pa","Você golpeia o chão e cria uma explosão de energia divina. Criaturas escolhidas a até 9 m fazem um TR de Constituição: se falharem, sofrem 5d6 de dano trovejante e 5d6 de dano radiante ou necrótico (à sua escolha) e caem; se passarem, sofrem metade e não caem.","");
S("Dissipar o Bem e Mal","Dispel Evil and Good",5,"abj","1 ação","Pessoal","V, S, M (água benta ou pó de prata e ferro)","Concentração, até 1 minuto","Cl Pa","Energia cintilante protege você contra celestiais, elementais, fadas, corruptores e mortos-vivos: eles têm desvantagem em ataques contra você. Você pode encerrar a magia para Quebrar Encantamento (termina enfeitiçado, amedrontado ou possessão numa criatura) ou para Dispensar uma dessas criaturas com um toque de volta ao plano natal (TR de Carisma).","");
S("Dominar Pessoa","Dominate Person",5,"enc","1 ação","18 m","V, S","Concentração, até 1 minuto","Ba Fe Ma","Um humanoide faz um TR de Sabedoria (com vantagem se estiver lutando com você) ou fica enfeitiçado. Você dá comandos telepáticos; com uma reação, controla diretamente as ações dele. Sempre que sofrer dano, ele repete o TR.","6º nível: até 10 minutos. 7º: até 1 hora. 8º ou mais: até 8 horas.");
S("Sonho","Dream",5,"ilu","1 minuto","Especial","V, S, M (areia, tinta e uma pena de escrever)","8 horas","Ba Bu Ma","Você, ou um mensageiro que tocar, entra nos sonhos de uma criatura conhecida no mesmo plano e conversa com ela. Você pode tornar o sonho aterrorizante: o alvo faz um TR de Sabedoria ou não recebe os benefícios do descanso e sofre 3d6 de dano psíquico ao acordar.","");
S("Coluna de Chamas","Flame Strike",5,"evo","1 ação","18 m","V, S, M (uma pitada de enxofre)","Instantânea","Cl","Um cilindro de fogo divino com 3 m de raio e 12 m de altura desce do céu. Cada criatura faz um TR de Destreza: 4d6 de dano de fogo e 4d6 de dano radiante, metade se passar.","+1d6 de dano de fogo ou radiante para cada nível de espaço acima do 5º.");
S("Missão","Geas",5,"enc","1 minuto","18 m","V","30 dias","Ba Cl Dr Ma Pa","Uma criatura que entenda você faz um TR de Sabedoria ou fica enfeitiçada e obrigada a cumprir um serviço ou a evitar uma ação que você determinar. Sempre que agir diretamente contra as ordens, sofre 5d10 de dano psíquico (no máximo uma vez por dia).","7º ou 8º nível: dura 1 ano. 9º: até ser dissipada.");
S("Restauração Maior","Greater Restoration",5,"abj","1 ação","Toque","V, S, M (pó de diamante de 100 po, consumido)","Instantânea","Ba Cl Dr","Remove um efeito da criatura tocada: um nível de exaustão; enfeitiçado ou petrificado; uma maldição (incluindo sintonia com item amaldiçoado); uma redução de valor de habilidade; ou uma redução dos PV máximos.","");
S("Consagrar","Hallow",5,"evo","24 horas","Toque","V, S, M (ervas, óleos e incenso de 1.000 po, consumidos)","Até ser dissipada","Cl","Consagra uma área de até 18 m de raio: celestiais, elementais, fadas, corruptores e mortos-vivos não entram nem podem enfeitiçar, amedrontar ou possuir criaturas ali. Você adiciona um efeito extra: coragem, escuridão, luz do dia, proteção contra energia, descanso eterno, interferência extradimensional, medo, silêncio, idiomas ou vulnerabilidade a energia.","");
S("Imobilizar Monstro","Hold Monster",5,"enc","1 ação","27 m","V, S, M (um pedaço pequeno e reto de ferro)","Concentração, até 1 minuto","Ba Bu Fe Ma","Uma criatura que você possa ver (exceto mortos-vivos) faz um TR de Sabedoria ou fica paralisada até a magia acabar. No fim de cada turno dela, repete o TR; se passar, a magia termina.","Uma criatura adicional para cada nível de espaço acima do 5º.");
S("Praga de Insetos","Insect Plague",5,"con","1 ação","90 m","V, S, M (açúcar, grãos e gordura)","Concentração, até 10 minutos","Cl Dr Fe","Gafanhotos formam uma esfera de 6 m de raio, levemente obscurecida e de terreno difícil. Quem entrar ou começar o turno ali faz um TR de Constituição: 4d10 de dano perfurante, metade se passar.","+1d10 de dano para cada nível de espaço acima do 5º.");
S("Conhecimento Lendário","Legend Lore",5,"adv","10 minutos","Pessoal","V, S, M (incenso de 250 po, consumido, e quatro tiras de marfim de 50 po)","Instantânea","Ba Cl Ma","Nomeie ou descreva uma pessoa, lugar ou objeto importante. Você recebe um breve resumo das lendas significativas sobre ele. Quanto mais você já souber, mais precisa é a resposta.","");
S("Curar Ferimentos em Massa","Mass Cure Wounds",5,"evo","1 ação","18 m","V, S","Instantânea","Ba Cl Dr","Até seis criaturas numa esfera de 9 m de raio recuperam PV iguais a 3d8 + seu modificador de habilidade de conjuração. Não afeta mortos-vivos nem constructos.","+1d8 de cura para cada nível de espaço acima do 5º.");
S("Despistar","Mislead",5,"ilu","1 ação","Pessoal","S","Concentração, até 1 hora","Ba Ma","Você fica invisível e um duplo ilusório seu aparece. Com uma ação bônus, você move o duplo até o dobro do seu deslocamento e o faz gesticular e falar. Você pode ver e ouvir através dele (ficando cego e surdo em relação ao seu corpo). A invisibilidade termina se você atacar ou conjurar uma magia.","");
S("Modificar Memória","Modify Memory",5,"enc","1 ação","9 m","V, S","Concentração, até 1 minuto","Ba Ma","Uma criatura faz um TR de Sabedoria (com vantagem se estiver lutando com você) ou fica enfeitiçada e incapacitada. Você pode apagar ou alterar as memórias dela sobre um evento das últimas 24 horas que durou até 10 minutos.","6º nível: eventos de até 7 dias atrás. 7º: 30 dias. 8º: 1 ano. 9º: qualquer momento.");
S("Criar Passagem","Passwall",5,"tra","1 ação","9 m","V, S, M (uma pitada de gergelim)","1 hora","Ma","Uma passagem de 1,5 m de largura, 2,4 m de altura e até 6 m de profundidade se abre numa superfície de madeira, gesso ou pedra. Quando a magia termina, quem estiver dentro é empurrado para fora com segurança.","");
S("Ligação Planar","Planar Binding",5,"abj","1 hora","18 m","V, S, M (uma joia de 1.000 po, consumida)","24 horas","Ba Cl Dr Ma","Um celestial, elemental, fada ou corruptor no alcance (normalmente preso num círculo) faz um TR de Carisma ou fica obrigado a servir você pela duração.","6º nível: 10 dias. 7º: 30 dias. 8º: 180 dias. 9º: 1 ano e 1 dia.");
S("Elo Telepático de Rary","Rary's Telepathic Bond",5,"adv","1 ação","9 m","V, S, M (cascas de ovo de duas espécies)","1 hora","Ma","Até oito criaturas voluntárias com Inteligência 3 ou mais ficam ligadas telepaticamente e podem se comunicar a qualquer distância no mesmo plano, mesmo sem idioma em comum.","","R");
S("Reviver os Mortos","Raise Dead",5,"nec","1 hora","Toque","V, S, M (um diamante de 500 po, consumido)","Instantânea","Ba Cl Pa","Traz de volta uma criatura morta há até 10 dias, se a alma quiser voltar. Ela volta com 1 PV, livre de venenos e doenças não mágicos, mas com -4 em jogadas de ataque, TR e testes; a penalidade diminui 1 a cada descanso longo. Não restaura partes perdidas nem funciona em mortos-vivos.","");
S("Reencarnação","Reincarnate",5,"tra","1 hora","Toque","V, S, M (óleos raros de 1.000 po, consumidos)","Instantânea","Dr","Uma criatura morta há até 10 dias recebe um novo corpo adulto de raça aleatória (role na tabela do livro), mantendo memórias e personalidade.","");
S("Vidência","Scrying",5,"adv","10 minutos","Pessoal","V, S, M (um foco de 1.000 po: bola de cristal, espelho de prata ou pia com água benta)","Concentração, até 10 minutos","Ba Bu Cl Dr Ma","Você vê e ouve uma criatura específica no mesmo plano. Ela faz um TR de Sabedoria, modificado pelo quanto você a conhece e pela conexão que tem com ela. Se falhar, um sensor invisível a acompanha. Você também pode mirar um lugar que conheça.","");
S("Similaridade","Seeming",5,"ilu","1 ação","9 m","V, S","8 horas","Ba Fe Ma","Muda a aparência de qualquer número de criaturas que você possa ver (as não voluntárias fazem TR de Carisma). Funciona como Disfarçar-se, mas em várias criaturas. Você pode encerrá-la com uma ação.","");
S("Aljava Veloz","Swift Quiver",5,"tra","1 ação bônus","Toque","V, S, M (uma aljava com pelo menos uma munição)","Concentração, até 1 minuto","Pt","A aljava produz munição sem fim. Em cada turno, com uma ação bônus, você pode fazer dois ataques à distância com arma usando essa munição.","");
S("Telecinésia","Telekinesis",5,"tra","1 ação","18 m","V, S","Concentração, até 10 minutos","Fe Ma","Você move criaturas ou objetos com a mente. Com uma ação, escolha: Criatura (teste da sua habilidade de conjuração contra teste de Força dela; se vencer, você a move até 9 m e a mantém impedida) ou Objeto (até 500 kg, movido até 9 m, com controle fino).","");
S("Círculo de Teletransporte","Teleportation Circle",5,"con","1 minuto","3 m","V, M (giz e tintas com pedras preciosas de 50 po, consumidos)","1 rodada","Ba Fe Ma","Você desenha um círculo ligado a um círculo de teletransporte permanente, cuja sequência de símbolos conheça, no mesmo plano. Qualquer criatura que entrar no círculo aparece no destino.","");
S("Passo Arbóreo","Tree Stride",5,"con","1 ação","Pessoal","V, S","Concentração, até 1 minuto","Dr Pt","Você pode entrar numa árvore e sair de outra do mesmo tipo a até 150 m, gastando 1,5 m de movimento. Pode fazer isso uma vez por rodada.","");
S("Muralha de Energia","Wall of Force",5,"evo","1 ação","36 m","V, S, M (pó de gema transparente)","Concentração, até 10 minutos","Ma","Uma muralha invisível de energia: cúpula ou esfera de até 3 m de raio, ou até dez painéis de 3 m por 3 m. Nada passa fisicamente por ela, é imune a todo dano e não pode ser dissipada (Desintegrar a destrói). Também existe no Plano Etéreo.","");
S("Muralha de Pedra","Wall of Stone",5,"evo","1 ação","36 m","V, S, M (um pequeno bloco de granito)","Concentração, até 10 minutos","Dr Fe Ma","Uma muralha de pedra com 15 cm de espessura, formada por dez painéis de 3 m por 3 m (ou 30 cm de espessura com painéis de 3 m por 6 m). Cada painel tem CA 15 e 30 PV a cada 2,5 cm de espessura. Se você mantiver a concentração pelos 10 minutos, a muralha fica permanente.","");

/* Banco de magias — 6º ao 9º nível. */

// ───── 6º NÍVEL ─────
S("Portal Arcano","Arcane Gate",6,"con","1 ação","150 m","V, S","Concentração, até 10 minutos","Bu Fe Ma","Cria dois portais circulares de 3 m ligados entre si, em pontos no alcance. Qualquer criatura ou objeto que entrar num deles sai pelo outro. Cada portal tem só um lado ativo; com uma ação bônus, você gira os lados ativos.","");
S("Barreira de Lâminas","Blade Barrier",6,"evo","1 ação","27 m","V, S","Concentração, até 10 minutos","Cl","Uma muralha de lâminas giratórias (até 30 m de comprimento, 6 m de altura e 1,5 m de espessura, ou um anel de 18 m de diâmetro). Dá cobertura de três quartos e é terreno difícil. Quem entrar nela pela primeira vez num turno ou começar o turno ali faz um TR de Destreza: 6d10 de dano cortante, metade se passar.","");
S("Corrente de Relâmpagos","Chain Lightning",6,"evo","1 ação","45 m","V, S, M (pelo, âmbar ou vidro e três alfinetes de prata)","Instantânea","Fe Ma","Um raio atinge um alvo e salta para até três outros a até 9 m dele. Cada alvo faz um TR de Destreza: 10d8 de dano elétrico, metade se passar.","Um alvo adicional para cada nível de espaço acima do 6º.");
S("Círculo da Morte","Circle of Death",6,"nec","1 ação","45 m","V, S, M (pó de pérola negra de 500 po)","Instantânea","Bu Fe Ma","Uma esfera de energia negativa com 18 m de raio. Cada criatura na área faz um TR de Constituição: 8d6 de dano necrótico, metade se passar.","+2d6 de dano para cada nível de espaço acima do 6º.");
S("Conjurar Fada","Conjure Fey",6,"con","1 minuto","27 m","V, S","Concentração, até 1 hora","Bu Dr","Convoca uma fada de ND 6 ou menor, ou um espírito feérico em forma de besta de ND 6 ou menor. Ela é amigável e obedece comandos verbais. Se a concentração for quebrada, fica hostil e permanece pelo tempo restante.","+1 no ND máximo para cada nível de espaço acima do 6º.");
S("Contingência","Contingency",6,"evo","10 minutos","Pessoal","V, S, M (uma estatueta sua de marfim com gemas de 1.500 po)","10 dias","Ma","Escolha uma magia de 5º nível ou menor que tenha você como alvo e uma condição de ativação. A magia é conjurada sozinha quando a condição acontecer.","");
S("Criar Mortos-Vivos","Create Undead",6,"nec","1 minuto","3 m","V, S, M (um pote de barro com terra de cemitério e uma ônix negra de 150 po por cadáver)","Instantânea","Bu Cl Ma","Só pode ser conjurada à noite. Até três cadáveres de humanoides Médios ou Pequenos viram carniçais sob seu controle por 24 horas (uma ação bônus para comandar).","7º nível: quatro carniçais. 8º: cinco carniçais ou dois lívidos ou abantesmas. 9º: seis carniçais, três lívidos ou abantesmas, ou duas múmias.");
S("Desintegrar","Disintegrate",6,"tra","1 ação","18 m","V, S, M (um ímã e uma pitada de pó)","Instantânea","Fe Ma","Um raio verde dispara contra um alvo. Ele faz um TR de Destreza ou sofre 10d6 + 40 de dano de energia. Se cair a 0 PV, vira pó. Destrói automaticamente objetos Grandes ou menores e criações de energia, como Muralha de Energia.","+3d6 de dano para cada nível de espaço acima do 6º.");
S("Convocação Instantânea de Drawmij","Drawmij's Instant Summons",6,"con","1 minuto","Toque","V, S, M (uma safira de 1.000 po)","Até ser dissipada","Ma","Você marca um objeto de até 5 kg e o liga a uma safira. Ao esmagar a safira, o objeto aparece na sua mão, onde quer que esteja. Se outra criatura o estiver segurando, você descobre quem e onde.","","R");
S("Mau-Olhado","Eyebite",6,"nec","1 ação","Pessoal","V, S","Concentração, até 1 minuto","Ba Bu Fe Ma","Seus olhos viram vazios negros. Em cada turno, com uma ação, uma criatura a até 18 m faz um TR de Sabedoria ou sofre um efeito à sua escolha: Adormecido (cai inconsciente), Pânico (fica amedrontado e foge) ou Nauseado (desvantagem em ataques e testes de habilidade).","");
S("Encontrar o Caminho","Find the Path",6,"adv","1 minuto","Pessoal","V, S, M (instrumentos de adivinhação de 100 po e um objeto do destino)","Concentração, até 1 dia","Ba Cl Dr","Você descobre o caminho físico mais curto e direto até um lugar fixo que conheça, no mesmo plano, e sabe sempre a direção e a distância.","");
S("Carne para Pedra","Flesh to Stone",6,"tra","1 ação","18 m","V, S, M (cal, água e terra)","Concentração, até 1 minuto","Bu Ma","Uma criatura faz um TR de Constituição; se falhar, fica impedida. No fim de cada turno, repete o TR: três sucessos encerram a magia; três falhas a transformam em pedra. Se a concentração durar o minuto inteiro, a petrificação é permanente.","");
S("Proibição","Forbiddance",6,"abj","10 minutos","Toque","V, S, M (água benta, incenso raro e pó de rubi de 1.000 po)","1 dia","Cl","Protege uma área de até 3.600 m² contra viagem mágica: ninguém se teletransporta para dentro nem usa portais. Escolha tipos de criatura (celestial, elemental, fada, corruptor, morto-vivo): eles sofrem 5d10 de dano radiante ou necrótico ao entrar pela primeira vez num turno ou começar o turno ali.","","R");
S("Globo de Invulnerabilidade","Globe of Invulnerability",6,"abj","1 ação","Pessoal (raio de 3 m)","V, S, M (uma conta de vidro ou cristal)","Concentração, até 1 minuto","Fe Ma","Uma barreira imóvel de 3 m de raio. Magias de 5º nível ou menor conjuradas de fora não afetam nada que esteja dentro.","Bloqueia magias de um nível a mais para cada nível de espaço acima do 6º.");
S("Guardiões e Proteções","Guards and Wards",6,"abj","10 minutos","Toque","V, S, M (incenso, enxofre, óleo, barbante e um cetro de prata de 10 po)","24 horas","Ba Ma","Protege uma área de até 225 m² com corredores enevoados, portas trancadas magicamente, teias nas escadas e portas ocultas por ilusão, além de um efeito extra (globos de luz, boca encantada, névoa fétida, lufada de vento ou sugestão).","");
S("Ferir","Harm",6,"nec","1 ação","18 m","V, S","Instantânea","Cl","Uma criatura faz um TR de Constituição: 14d6 de dano necrótico, metade se passar. Se falhar, os PV máximos dela também diminuem pelo valor do dano. Não reduz o alvo abaixo de 1 PV.","");
S("Cura Completa","Heal",6,"evo","1 ação","18 m","V, S","Instantânea","Cl Dr","Uma criatura recupera 70 PV e fica livre de cegueira, surdez e doenças. Não afeta mortos-vivos nem constructos.","+10 PV para cada nível de espaço acima do 6º.");
S("Banquete de Heróis","Heroes' Feast",6,"con","10 minutos","9 m","V, S, M (uma tigela com gemas de 1.000 po, consumida)","Instantânea","Cl Dr","Um banquete para até doze criaturas. Quem comer (leva 1 hora) fica curado de doenças e venenos, imune a veneno e a amedrontado, com vantagem em TR de Sabedoria e +2d10 PV máximos e atuais por 24 horas.","");
S("Recipiente Arcano","Magic Jar",6,"nec","1 minuto","Pessoal","V, S, M (uma gema ou relicário de 500 po)","Até ser dissipada","Ma","Sua alma passa para um recipiente e seu corpo fica inerte. Do recipiente, você pode tentar possuir um humanoide a até 30 m (TR de Carisma). Se conseguir, controla o corpo dele, com as estatísticas dele e sua Inteligência, Sabedoria e Carisma.","");
S("Sugestão em Massa","Mass Suggestion",6,"enc","1 ação","18 m","V, M (uma língua de cobra e um pouco de mel)","24 horas","Ba Bu Fe Ma","Funciona como Sugestão, mas afeta até doze criaturas e não exige concentração.","7º nível: 10 dias. 8º: 30 dias. 9º: 1 ano e 1 dia.");
S("Mover Terra","Move Earth",6,"tra","1 ação","36 m","V, S, M (uma lâmina de ferro e um saquinho de terra)","Concentração, até 2 horas","Dr Fe Ma","Molda terra, areia ou argila (não pedra) numa área de até 12 m de lado. A cada 10 minutos, você pode escavar, erguer, nivelar ou remodelar o terreno, criando colinas, fossos ou barreiras.","");
S("Esfera Congelante de Otiluke","Otiluke's Freezing Sphere",6,"evo","1 ação","90 m","V, S, M (uma pequena esfera de cristal)","Instantânea","Ma","Um globo de energia gelada explode numa esfera de 18 m de raio. Cada criatura faz um TR de Constituição: 10d6 de dano de frio, metade se passar. Congela a superfície da água. Você pode segurar o globo e arremessá-lo depois.","+1d6 de dano para cada nível de espaço acima do 6º.");
S("Dança Irresistível de Otto","Otto's Irresistible Dance",6,"enc","1 ação","9 m","V","Concentração, até 1 minuto","Ba Ma","Uma criatura começa a dançar sem controle, sem TR inicial: gasta todo o movimento dançando no lugar, tem desvantagem em TR de Destreza e jogadas de ataque, e os outros têm vantagem contra ela. Com uma ação, ela pode fazer um TR de Sabedoria para encerrar a magia.","");
S("Aliado Planar","Planar Ally",6,"con","10 minutos","18 m","V, S","Instantânea","Cl","Você pede ajuda a uma entidade de outro plano, que envia um celestial, elemental ou corruptor leal a ela. A criatura negocia um pagamento pelo serviço; tarefas curtas custam menos.","");
S("Ilusão Programada","Programmed Illusion",6,"ilu","1 ação","36 m","V, S, M (um pouco de lã e pó de jade de 25 po)","Até ser dissipada","Ba Ma","Cria uma ilusão com som (até um cubo de 9 m) que é ativada quando uma condição definida por você acontece, executando uma cena programada de até 5 minutos. Depois fica inativa por 10 minutos e pode se repetir.","");
S("Raio Solar","Sunbeam",6,"evo","1 ação","Pessoal (linha de 18 m)","V, S, M (uma lupa)","Concentração, até 1 minuto","Dr Fe Ma","Um raio de luz solar numa linha de 18 m por 1,5 m. Cada criatura faz um TR de Constituição: se falhar, sofre 6d8 de dano radiante e fica cega até o seu próximo turno; se passar, sofre metade e não fica cega. Mortos-vivos e limos têm desvantagem. Com uma ação, você cria um novo raio nos turnos seguintes.","");
S("Transporte pelas Plantas","Transport via Plants",6,"con","1 ação","3 m","V, S","1 rodada","Dr","Liga uma planta viva Grande ou maior a outra no mesmo plano que você já tenha visto ou tocado. Qualquer criatura pode entrar na primeira e sair pela segunda gastando 1,5 m de movimento.","");
S("Visão da Verdade","True Seeing",6,"adv","1 ação","Toque","V, S, M (um unguento de 25 po, consumido)","1 hora","Ba Bu Cl Fe Ma","A criatura ganha visão verdadeira a até 36 m: nota portas secretas escondidas por magia, enxerga na escuridão normal e mágica, vê criaturas e objetos invisíveis, percebe ilusões, vê a forma original de metamorfos e enxerga o Plano Etéreo.","");
S("Muralha de Gelo","Wall of Ice",6,"evo","1 ação","36 m","V, S, M (um pedaço de quartzo)","Concentração, até 10 minutos","Ma","Uma muralha de gelo (cúpula, esfera ou dez painéis de 3 m por 3 m, com 30 cm de espessura). Ao surgir, quem estiver na área faz um TR de Destreza: 10d6 de dano de frio, metade se passar. Cada painel tem CA 12 e 30 PV; destruído, deixa uma lâmina de ar gelado (5d6 de frio, TR de Constituição).","+2d6 no dano ao surgir e +1d6 no ar gelado para cada nível de espaço acima do 6º.");
S("Muralha de Espinhos","Wall of Thorns",6,"con","1 ação","36 m","V, S, M (um punhado de espinhos)","Concentração, até 10 minutos","Dr","Uma muralha de arbustos espinhosos (até 18 m de comprimento, 3 m de altura e 1,5 m de espessura). Ao surgir, criaturas na área fazem um TR de Destreza: 7d8 de dano perfurante, metade se passar. Atravessar custa 4 vezes o movimento e causa 7d8 de dano cortante (TR de Destreza para metade).","+1d8 nos dois danos para cada nível de espaço acima do 6º.");
S("Caminhar no Vento","Wind Walk",6,"tra","1 minuto","9 m","V, S, M (fogo e água benta)","8 horas","Dr","Você e até dez criaturas voluntárias viram nuvens: voo de 90 m, resistência a dano não mágico, e só podem usar Disparada ou voltar à forma normal (leva 1 minuto).","");
S("Palavra de Recordação","Word of Recall",6,"con","1 ação","1,5 m","V","Instantânea","Cl","Você e até cinco criaturas voluntárias a até 1,5 m são teletransportados para um santuário que você designou antes.","");

// ───── 7º NÍVEL ─────
S("Conjurar Celestial","Conjure Celestial",7,"con","1 minuto","27 m","V, S","Concentração, até 1 hora","Cl","Convoca um celestial de ND 4 ou menor. Ele é amigável e obedece seus comandos verbais.","Com espaço de 9º nível, o ND máximo é 5.");
S("Bola de Fogo Controlável","Delayed Blast Fireball",7,"evo","1 ação","45 m","V, S, M (guano de morcego e enxofre)","Concentração, até 1 minuto","Fe Ma","Uma conta de fogo flutua no ponto escolhido. Quando explode (ao fim da magia ou se a concentração cair), causa 12d6 de dano de fogo numa esfera de 6 m de raio (TR de Destreza para metade). O dano aumenta 1d6 a cada turno que você a mantém. Uma criatura pode tocá-la e arremessá-la para longe.","+1d6 no dano base para cada nível de espaço acima do 7º.");
S("Palavra Divina","Divine Word",7,"evo","1 ação bônus","9 m","V","Instantânea","Cl","Criaturas escolhidas que possam ouvir você fazem um TR de Carisma. Quem falhar sofre um efeito conforme os PV atuais: 50 ou menos, surdo por 1 minuto; 40 ou menos, surdo e cego por 10 minutos; 30 ou menos, cego, surdo e atordoado por 1 hora; 20 ou menos, morre. Celestiais, elementais, fadas e corruptores que falharem são mandados de volta ao plano natal.","");
S("Forma Etérea","Etherealness",7,"tra","1 ação","Pessoal","V, S","Até 8 horas","Ba Bu Cl Fe Ma","Você entra no Plano Etéreo, onde pode se mover em qualquer direção e atravessar objetos. Só afeta e é afetado por criaturas no Etéreo. Ao voltar, retorna ao espaço correspondente no Plano Material.","Três criaturas voluntárias adicionais para cada nível de espaço acima do 7º.");
S("Dedo da Morte","Finger of Death",7,"nec","1 ação","18 m","V, S","Instantânea","Bu Fe Ma","Uma criatura faz um TR de Constituição: 7d8 + 30 de dano necrótico, metade se passar. Um humanoide morto por esta magia se levanta como zumbi no seu próximo turno, sob seu comando permanente.","");
S("Tempestade de Fogo","Fire Storm",7,"evo","1 ação","45 m","V, S","Instantânea","Cl Dr Fe","Até dez cubos de fogo de 3 m, cada um encostado em outro. Cada criatura na área faz um TR de Destreza: 7d10 de dano de fogo, metade se passar. Você pode poupar a vegetação.","");
S("Jaula de Energia","Forcecage",7,"evo","1 ação","30 m","V, S, M (pó de rubi de 1.500 po)","1 hora","Ba Bu Ma","Uma prisão cúbica, invisível e imóvel: uma jaula de barras com 6 m de lado ou uma caixa sólida de 3 m. Quem está dentro não sai por meios físicos; para se teletransportar para fora, precisa passar num TR de Carisma. Não pode ser dissipada.","");
S("Miragem Arcana","Mirage Arcane",7,"ilu","10 minutos","Visão","V, S","10 dias","Ba Dr Ma","Um terreno de até 1,5 km quadrado parece, soa, cheira e tem a textura de outro tipo de terreno, incluindo construções. Criaturas com visão verdadeira veem a realidade.","");
S("Mansão Magnífica de Mordenkainen","Mordenkainen's Magnificent Mansion",7,"con","1 minuto","90 m","V, S, M (um portal em miniatura, madeira polida e uma colher de prata, de 5 po cada)","24 horas","Ba Ma","Uma porta leva a uma mansão extradimensional com até 50 cubos de 3 m, mobiliada, com 100 servos invisíveis e um banquete para 100 pessoas.","");
S("Espada de Mordenkainen","Mordenkainen's Sword",7,"evo","1 ação","18 m","V, S, M (uma espada de platina em miniatura de 250 po)","Concentração, até 1 minuto","Ba Ma","Uma espada de energia flutuante. Ao conjurar, faça um ataque mágico corpo a corpo: 3d10 de dano de energia. Com uma ação bônus nos turnos seguintes, mova a espada até 6 m e repita o ataque.","");
S("Viagem Planar","Plane Shift",7,"con","1 ação","Toque","V, S, M (uma haste de metal bifurcada de 250 po sintonizada com o plano)","Instantânea","Bu Cl Dr Fe Ma","Você e até oito criaturas de mãos dadas viajam para outro plano de existência. Também pode ser usada para banir: ataque mágico corpo a corpo e TR de Carisma; se falhar, a criatura vai para um lugar aleatório do plano escolhido.","");
S("Spray Prismático","Prismatic Spray",7,"evo","1 ação","Pessoal (cone de 18 m)","V, S","Instantânea","Fe Ma","Oito raios coloridos saem da sua mão. Cada criatura no cone faz um TR de Destreza e rola 1d8 para o raio que a atinge: 1 vermelho (10d6 fogo), 2 laranja (10d6 ácido), 3 amarelo (10d6 elétrico), 4 verde (10d6 veneno), 5 azul (10d6 frio), 6 anil (impedida, pode ser petrificada), 7 violeta (cega, pode ser levada a outro plano), 8 dois raios (role de novo duas vezes).","");
S("Projetar Imagem","Project Image",7,"ilu","1 ação","750 km","V, S, M (uma estatueta sua de 5 po)","Concentração, até 1 dia","Ba Ma","Cria uma cópia ilusória sua num lugar que você já viu. Você pode ver, ouvir e falar através dela; com uma ação, a move. Tocá-la revela que é uma ilusão.","");
S("Regeneração","Regenerate",7,"tra","1 minuto","Toque","V, S, M (um terço de oração e água benta)","1 hora","Ba Cl Dr","A criatura recupera 4d8 + 15 PV e depois 1 PV no início de cada turno dela. Membros perdidos voltam a crescer em 2 minutos.","");
S("Ressurreição","Resurrection",7,"nec","1 hora","Toque","V, S, M (um diamante de 1.000 po, consumido)","Instantânea","Ba Cl","Traz de volta uma criatura morta há até 100 anos (que não tenha morrido de velhice) com todos os PV, curando venenos e doenças e restaurando membros. Ela tem -4 em testes, TR e jogadas de ataque, reduzindo 1 a cada descanso longo.","");
S("Inverter a Gravidade","Reverse Gravity",7,"tra","1 ação","30 m","V, S, M (magnetita e limalha de ferro)","Concentração, até 1 minuto","Dr Fe Ma","Num cilindro de 15 m de raio e 30 m de altura, a gravidade se inverte: criaturas e objetos soltos caem para cima até o topo. Uma criatura pode fazer um TR de Destreza para se segurar em algo fixo.","");
S("Isolamento","Sequester",7,"tra","1 ação","Toque","V, S, M (pó de diamante, esmeralda, rubi e safira de 5.000 po, consumido)","Até ser dissipada","Ma","Uma criatura voluntária ou um objeto fica invisível e não pode ser detectado por adivinhação. Uma criatura fica em animação suspensa. Você pode definir uma condição que encerra a magia.","");
S("Simulacro","Simulacrum",7,"ilu","12 horas","Toque","V, S, M (neve ou gelo, cabelo ou unhas da criatura e pó de rubi de 1.500 po)","Até ser dissipada","Ma","Cria uma duplicata ilusória de uma besta ou humanoide, com metade dos PV máximos do original, que obedece você. Ela não recupera espaços de magia nem ganha níveis. Se você conjurar a magia de novo, a duplicata anterior é destruída.","");
S("Símbolo","Symbol",7,"abj","1 minuto","Toque","V, S, M (mercúrio, fósforo e pó de diamante e opala de 1.000 po, consumidos)","Até ser dissipada ou ativada","Ba Cl Dr Ma","Você inscreve um glifo perigoso numa superfície. Quando a condição definida acontece, ele afeta criaturas num raio de 18 m com um efeito: Morte (10d10 necrótico), Discórdia, Medo, Desesperança, Insanidade, Dor, Sono ou Atordoamento, cada um com seu TR.","");
S("Teletransporte","Teleport",7,"con","1 ação","3 m","V","Instantânea","Ba Fe Ma","Você e até oito criaturas voluntárias (ou um objeto) vão para um destino no mesmo plano. A chance de chegar ao lugar certo depende de quão bem você conhece o destino: role 1d100 para ver se chega no alvo, perto dele, numa área parecida ou sofre um acidente.","");

// ───── 8º NÍVEL ─────
S("Formas Animais","Animal Shapes",8,"tra","1 ação","9 m","V, S","Concentração, até 24 horas","Dr","Transforma qualquer número de criaturas voluntárias em bestas Grandes ou menores de ND 4 ou menor. Com uma ação, você pode trocar a forma delas. Funciona como Metamorfose em grupo.","");
S("Campo Antimagia","Antimagic Field",8,"abj","1 ação","Pessoal (esfera de 3 m de raio)","V, S, M (pó ou limalha de ferro)","Concentração, até 1 hora","Cl Ma","Uma esfera de 3 m ao seu redor onde a magia não funciona: magias e efeitos mágicos são suprimidos, itens mágicos ficam comuns, criaturas convocadas somem temporariamente e teletransporte falha.","");
S("Antipatia/Simpatia","Antipathy/Sympathy",8,"enc","1 hora","18 m","V, S, M (vinagre e mel, ou alume)","10 dias","Dr Ma","Um objeto ou área de até 60 m atrai ou repele um tipo de criatura escolhido. Antipatia: a criatura faz um TR de Sabedoria ou fica amedrontada e precisa se afastar. Simpatia: ela faz um TR de Sabedoria ou se sente compelida a se aproximar e ficar.","");
S("Clone","Clone",8,"nec","1 hora","Toque","V, S, M (diamante de 1.000 po, um pedaço de carne da criatura e um recipiente de 2.000 po)","Instantânea","Ma","Cria uma duplicata inerte de uma criatura viva, que amadurece em 120 dias. Se a criatura original morrer, a alma dela vai para o clone, se estiver livre e quiser.","");
S("Controlar o Clima","Control Weather",8,"tra","10 minutos","Pessoal (raio de 7,5 km)","V, S, M (incenso, terra e madeira misturadas em água)","Concentração, até 8 horas","Cl Dr Ma","Você muda o clima num raio de 7,5 km (só ao ar livre). Altera chuva, temperatura e vento, um estágio de cada vez, a cada 1d4 × 10 minutos.","");
S("Semiplano","Demiplane",8,"con","1 ação","18 m","S","1 hora","Bu Ma","Uma porta sombria surge numa superfície e leva a um semiplano: uma sala vazia de 9 m em cada dimensão. Quando a magia acaba, quem estiver dentro fica preso lá. Você pode criar um semiplano novo ou reconectar um que já criou.","");
S("Dominar Monstro","Dominate Monster",8,"enc","1 ação","18 m","V, S","Concentração, até 1 hora","Ba Bu Fe Ma","Uma criatura faz um TR de Sabedoria (com vantagem se estiver lutando com você) ou fica enfeitiçada e sob seu controle telepático. Com uma reação, você controla diretamente as ações dela. Sempre que sofrer dano, ela repete o TR.","Com espaço de 9º nível, até 8 horas.");
S("Terremoto","Earthquake",8,"evo","1 ação","150 m","V, S, M (terra, um pedaço de rocha e argila)","Concentração, até 1 minuto","Cl Dr Fe","Um tremor sacode um círculo de 30 m de raio, que vira terreno difícil. Criaturas no chão fazem um TR de Destreza ou caem; quem está concentrado faz TR de Constituição. Fissuras se abrem e construções sofrem 50 de dano contundente por turno, podendo desabar.","");
S("Enfraquecer o Intelecto","Feeblemind",8,"enc","1 ação","45 m","V, S, M (um punhado de esferas de argila, cristal ou vidro)","Instantânea","Ba Bu Dr Ma","Uma criatura sofre 4d6 de dano psíquico e faz um TR de Inteligência. Se falhar, Inteligência e Carisma viram 1: não pode conjurar magias, ativar itens mágicos, entender idiomas nem se comunicar. Repete o TR a cada 30 dias. Restauração Maior, Cura Completa ou Desejo curam o efeito.","");
S("Loquacidade","Glibness",8,"tra","1 ação","Pessoal","V","1 hora","Ba Bu","Quando fizer um teste de Carisma, você pode trocar o resultado do dado por 15. Magias que detectam mentiras indicam que você está dizendo a verdade.","");
S("Aura Sagrada","Holy Aura",8,"abj","1 ação","Pessoal","V, S, M (um relicário de 1.000 po)","Concentração, até 1 minuto","Cl","Luz divina irradia de você num raio de 9 m. Criaturas escolhidas têm vantagem em todos os TR, e os outros têm desvantagem em ataques contra elas. Um corruptor ou morto-vivo que acertar uma criatura protegida corpo a corpo faz um TR de Constituição ou fica cego.","");
S("Nuvem Incendiária","Incendiary Cloud",8,"con","1 ação","45 m","V, S","Concentração, até 1 minuto","Fe Ma","Uma nuvem de fumaça e brasas com 6 m de raio, densamente obscurecida. Quem entrar nela pela primeira vez num turno ou começar o turno ali faz um TR de Destreza: 10d8 de dano de fogo, metade se passar. A nuvem se move 3 m por turno na direção que você escolher.","");
S("Labirinto","Maze",8,"con","1 ação","18 m","V, S","Concentração, até 10 minutos","Ma","Bane uma criatura para um semiplano em forma de labirinto, sem TR. Com uma ação, ela pode tentar escapar com um teste de Inteligência CD 20. Minotauros e demônios goristro escapam automaticamente.","");
S("Mente em Branco","Mind Blank",8,"abj","1 ação","Toque","V, S","24 horas","Ba Ma","Uma criatura voluntária fica imune a dano psíquico, a efeitos que leiam emoções ou pensamentos, a magias de adivinhação e a enfeitiçado. Nem Desejo consegue afetá-la dessas formas.","");
S("Palavra de Poder Atordoar","Power Word Stun",8,"enc","1 ação","18 m","V","Instantânea","Ba Bu Fe Ma","Se a criatura tiver 150 PV ou menos, fica atordoada, sem TR inicial. No fim de cada turno dela, faz um TR de Constituição para encerrar o efeito.","");
S("Explosão Solar","Sunburst",8,"evo","1 ação","45 m","V, S, M (fogo e um pedaço de pedra-do-sol)","Instantânea","Dr Fe Ma","Luz solar brilha numa esfera de 18 m de raio. Cada criatura faz um TR de Constituição: se falhar, 12d6 de dano radiante e fica cega por 1 minuto; se passar, metade do dano e não fica cega. Mortos-vivos e limos têm desvantagem. Dissipa escuridão mágica na área.","");
S("Telepatia","Telepathy",8,"evo","1 ação","Ilimitado","V, S, M (dois anéis de prata entrelaçados)","24 horas","Ma","Cria um elo telepático entre você e uma criatura conhecida no mesmo plano. Vocês podem trocar palavras, imagens, sons e outras sensações.","");
S("Tsunami","Tsunami",8,"con","1 minuto","Visão","V, S","Concentração, até 6 rodadas","Dr","Uma muralha de água de até 90 m de comprimento, 90 m de altura e 15 m de espessura. Criaturas atingidas fazem um TR de Força: 6d10 de dano contundente, metade se passar. A onda avança 15 m por turno e perde força a cada rodada.","");

S("Presciência","Foresight",9,"adv","1 minuto","Toque","V, S, M (uma pena de beija-flor)","8 horas","Ba Bu Dr Ma","A criatura tocada enxerga o futuro imediato: não pode ser surpreendida, tem vantagem em jogadas de ataque, testes de habilidade e TR, e outras criaturas têm desvantagem em ataques contra ela.","");
S("Portal","Gate",9,"con","1 ação","18 m","V, S, M (um diamante de 5.000 po)","Concentração, até 1 minuto","Cl Fe Ma","Abre um portal ligado a outro plano. Se você disser o nome de uma criatura específica de outro plano, o portal abre ao lado dela e a puxa para o seu lado.","");
S("Aprisionamento","Imprisonment",9,"abj","1 minuto","9 m","V, S, M (varia conforme a prisão, 500 po por DV do alvo)","Até ser dissipada","Bu Ma","Uma criatura faz um TR de Sabedoria ou fica aprisionada de uma destas formas: Sepultamento, Acorrentamento, Prisão Protegida, Contenção Mínima ou Sono Eterno. Você pode definir uma condição de libertação.","");
S("Cura Completa em Massa","Mass Heal",9,"evo","1 ação","18 m","V, S","Instantânea","Cl","Distribua até 700 PV de cura entre criaturas que você possa ver. Elas também ficam livres de doenças, cegueira e surdez.","");
S("Chuva de Meteoros","Meteor Swarm",9,"evo","1 ação","1,5 km","V, S","Instantânea","Fe Ma","Quatro esferas de fogo caem em pontos escolhidos. Cada criatura numa esfera de 12 m de raio de cada ponto faz um TR de Destreza: 20d6 de dano de fogo e 20d6 de dano contundente, metade se passar. Uma criatura em mais de uma área é afetada só uma vez.","");
S("Palavra de Poder Curar","Power Word Heal",9,"evo","1 ação","Toque","V, S","Instantânea","Ba","Uma criatura recupera todos os PV. Se estiver enfeitiçada, amedrontada, paralisada ou atordoada, a condição termina. Se estiver caída, pode usar a reação para se levantar.","");
S("Palavra de Poder Matar","Power Word Kill",9,"enc","1 ação","18 m","V","Instantânea","Ba Bu Fe Ma","Se a criatura tiver 100 PV ou menos, ela morre, sem TR.","");
S("Muralha Prismática","Prismatic Wall",9,"abj","1 ação","18 m","V, S","10 minutos","Ma","Uma muralha de luz com sete camadas (vermelho, laranja, amarelo, verde, azul, anil e violeta), cada uma com um efeito e um jeito específico de ser destruída. Criaturas a até 6 m que olharem para ela fazem um TR de Constituição ou ficam cegas por 1 minuto.","");
S("Mudança de Forma","Shapechange",9,"tra","1 ação","Pessoal","V, S, M (um diadema de jade de 1.500 po)","Concentração, até 1 hora","Dr Ma","Você assume a forma de uma criatura de ND igual ou menor que o seu nível que já tenha visto (não constructo nem morto-vivo). Ganha as estatísticas dela e mantém Inteligência, Sabedoria e Carisma. Com uma ação, pode mudar para outra forma.","");
S("Tempestade da Vingança","Storm of Vengeance",9,"con","1 ação","Visão","V, S","Concentração, até 1 minuto","Dr","Uma nuvem de tempestade com 150 m de raio. Cada rodada traz um efeito: trovão (2d6 trovejante e surdez), chuva ácida (4d6 ácido), relâmpagos (10d6 elétrico em até seis criaturas), granizo (2d6 contundente) e, depois, rajadas de vento e frio.","");
S("Parar o Tempo","Time Stop",9,"tra","1 ação","Pessoal","V","Instantânea","Fe Ma","O tempo para para todos menos você. Você tem 1d4 + 1 turnos seguidos. A magia termina se uma ação sua afetar outra criatura ou um objeto que alguém carregue, ou se você se afastar mais de 300 m de onde conjurou.","");
S("Metamorfose Verdadeira","True Polymorph",9,"tra","1 ação","9 m","V, S, M (mercúrio, goma-arábica e um pouco de fumaça)","Concentração, até 1 hora","Ba Bu Ma","Transforma uma criatura em outra criatura, uma criatura em objeto ou um objeto em criatura (TR de Sabedoria se não for voluntária). Se você mantiver a concentração pela duração completa, a transformação dura até ser dissipada.","");
S("Ressurreição Verdadeira","True Resurrection",9,"nec","1 hora","Toque","V, S, M (água benta e diamantes de 25.000 po, consumidos)","Instantânea","Cl Dr","Traz de volta uma criatura morta há até 200 anos (que não tenha morrido de velhice) com todos os PV, curada de venenos e doenças, e com um corpo novo se necessário.","");
S("Estranho","Weird",9,"ilu","1 ação","36 m","V, S","Concentração, até 1 minuto","Ma","Cria ilusões dos piores medos de cada criatura numa esfera de 9 m de raio. Cada uma faz um TR de Sabedoria ou fica amedrontada. No fim de cada turno, repete o TR: se falhar, sofre 4d10 de dano psíquico; se passar, a magia termina para ela.","");
S("Desejo","Wish",9,"con","1 ação","Pessoal","V","Instantânea","Fe Ma","A magia mais poderosa que um mortal pode conjurar. Uso básico: reproduzir qualquer magia de 8º nível ou menor, sem precisar de componentes. Outros usos: criar um objeto, curar até vinte criaturas, conceder resistência, imunidade a uma magia ou desfazer um acontecimento recente. Pedidos maiores ficam a critério do mestre e podem enfraquecer você (33% de chance de nunca mais conjurar Desejo).","");

function slotsFor(type, lvl) {
  let e = 0;
  if (type === "full") e = lvl;
  else if (type === "half") e = lvl >= 2 ? Math.ceil(lvl / 2) : 0;
  else if (type === "third") e = lvl >= 3 ? Math.ceil(lvl / 3) : 0;
  return FULL_SLOTS[e] || [];
}
function pactFor(lvl) {
  return { n: lvl === 1 ? 1 : lvl <= 10 ? 2 : lvl <= 16 ? 3 : 4, l: Math.min(5, Math.ceil(lvl / 2)) };
}

function fix(c) {
  c.inv = Array.isArray(c.inv) ? c.inv : [];
  c.spells = Array.isArray(c.spells) ? c.spells.filter(x => x && SP[x.id]) : [];
  c.prep = Array.isArray(c.prep) ? c.prep : [];
  c.used = Object.assign(blankUsed(), c.used || {});
  if (!CLASSES[c.cls]) c.cls = "bardo";
  if (!RACES[c.race]) c.race = "humano";
  c.level = clampLvl(c.level);
  c.score = Math.max(1, Math.min(30, parseInt(c.score, 10) || 10));
  if (!c.id) c.id = uid();
  return c;
}
function load() {
  try {
    const j = JSON.parse(localStorage.getItem(KEY));
    if (j && Array.isArray(j.chars) && j.chars.length) { j.chars.forEach(fix); return j; }
  } catch (e) {}
  const ex = example();
  return { chars: [ex], cur: ex.id };
}
